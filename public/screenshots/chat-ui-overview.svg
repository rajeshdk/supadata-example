<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="780" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Window Top Bar -->
  <rect width="1200" height="48" rx="16" fill="#0f172a"/>
  <rect y="32" width="1200" height="16" fill="#0f172a"/>
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>
  <text x="600" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Supa Agent — Multimodal Research &amp; Video Assistant (Live SDK)</text>

  <!-- Navbar -->
  <rect y="48" width="1200" height="64" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <!-- Logo -->
  <rect x="32" y="62" width="36" height="36" rx="8" fill="url(#brand-grad)"/>
  <text x="50" y="85" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">⚡</text>
  <text x="80" y="81" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Supa Agent</text>
  <rect x="175" y="69" width="75" height="20" rx="6" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
  <text x="212" y="83" fill="#a5b4fc" font-family="monospace" font-size="11" text-anchor="middle">Starter Kit</text>

  <!-- Live Status Badge -->
  <rect x="760" y="68" width="160" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <circle cx="778" cy="81" r="4" fill="#34d399"/>
  <text x="846" y="85" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Live SDK Connected</text>

  <!-- Action Buttons -->
  <rect x="932" y="66" width="110" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="987" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">⚙️ Agent Tools</text>

  <rect x="1054" y="66" width="114" height="30" rx="8" fill="#4f46e5"/>
  <text x="1111" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">GitHub Repo ↗</text>

  <!-- Chat Area Container -->
  <!-- User Message -->
  <g transform="translate(320, 136)">
    <rect width="848" height="60" rx="16" fill="#4f46e5"/>
    <text x="816" y="35" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="end">Summarize key takeaways from this video: https://www.youtube.com/watch?v=bvy_lPzYgcs</text>
  </g>
  <circle cx="1180" cy="166" r="14" fill="#334155"/>
  <text x="1180" y="171" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">👤</text>

  <!-- Assistant Response with Tool Card -->
  <g transform="translate(70, 220)">
    <!-- Assistant Avatar -->
    <rect x="-38" y="0" width="28" height="28" rx="8" fill="url(#brand-grad)"/>
    <text x="-24" y="19" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">🤖</text>

    <!-- Tool Execution Card -->
    <rect x="0" y="0" width="820" height="68" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="12" y="14" width="40" height="40" rx="8" fill="#e11d48" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1"/>
    <text x="32" y="39" fill="#fb7185" font-family="sans-serif" font-size="18" text-anchor="middle">🎬</text>

    <text x="64" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Video Transcript</text>
    <rect x="165" y="20" width="95" height="18" rx="4" fill="#1e293b"/>
    <text x="212" y="33" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">get_transcript</text>

    <text x="64" y="49" fill="#64748b" font-family="monospace" font-size="11">https://www.youtube.com/watch?v=bvy_lPzYgcs • text: true • lang: en</text>

    <!-- Tool Status Badges -->
    <rect x="660" y="24" width="78" height="22" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="699" y="39" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Success</text>

    <rect x="746" y="24" width="60" height="22" rx="6" fill="#1e293b"/>
    <text x="776" y="39" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">342ms</text>

    <!-- Synthesized AI Response Bubble -->
    <g transform="translate(0, 80)">
      <rect width="820" height="340" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="24" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Video Summary: "What is an AI Agent? 7 Types Explained"</text>

      <text x="24" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">I extracted and analyzed the full spoken transcript from YouTube using </text>
      <text x="438" y="64" fill="#818cf8" font-family="monospace" font-size="12" font-weight="600">supadata.transcript</text>
      <text x="590" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">:</text>

      <rect x="24" y="82" width="772" height="1" fill="#1e293b"/>

      <text x="24" y="112" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Key Architectural Takeaways:</text>

      <circle cx="32" cy="138" r="3" fill="#6366f1"/>
      <text x="44" y="142" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <tspan font-weight="bold" fill="#ffffff">The Agent Execution Loop: </tspan>Agents differ from simple chatbots by executing a continuous feedback loop:
      </text>
      <text x="44" y="162" fill="#a5b4fc" font-family="monospace" font-size="12">Perceive Environment → Reason / Plan → Call External Tools → Evaluate Observation</text>

      <circle cx="32" cy="192" r="3" fill="#6366f1"/>
      <text x="44" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <tspan font-weight="bold" fill="#ffffff">7 Core Agent Archetypes: </tspan>Ranging from Simple Reflex and Model-Based up to Multi-Agent Systems
      </text>
      <text x="44" y="214" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">and Foundation Model Agents equipped with real-world actuators.</text>

      <circle cx="32" cy="242" r="3" fill="#6366f1"/>
      <text x="44" y="246" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <tspan font-weight="bold" fill="#ffffff">Actuator / Tool Requirement: </tspan>LLMs cannot browse the web or watch videos natively. Providers like
      </text>
      <text x="44" y="264" fill="#818cf8" font-family="monospace" font-size="12">Supadata (@supadata/js)</text>
      <text x="235" y="264" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13"> serve as high-speed data tools to give agents real sensory perception.</text>

      <!-- Timestamp citation -->
      <rect x="24" y="286" width="310" height="26" rx="6" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
      <text x="36" y="303" fill="#c7d2fe" font-family="monospace" font-size="11">⏱️ Quoted from 01:14 to 03:45 in video</text>
    </g>
  </g>

  <!-- Bottom Chat Input Bar -->
  <g transform="translate(100, 680)">
    <rect width="1000" height="56" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="34" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Ask Supa Agent anything... (e.g. scrape docs or search YouTube)</text>
    <rect x="946" y="8" width="40" height="40" rx="10" fill="#4f46e5"/>
    <text x="966" y="33" fill="#ffffff" font-family="sans-serif" font-size="16" text-anchor="middle">➔</text>
  </g>
</svg>
